<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">📝 Register</h3>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Full Name -->
      <div class="mb-3">
        <label class="form-label">User Name</label>
        <input type="text" class="form-control" formControlName="userName" />
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" formControlName="email" />
      </div>

      <!-- Password -->
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password" />
          <small
          class="text-danger"
          *ngIf="registerForm.get('password')?.hasError('minlength') && registerForm.get('password')?.touched" >
          Password must be at least 6 characters long
        </small>
      </div>

      <!-- Confirm Password -->
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        <input type="password" class="form-control" formControlName="confirmPassword" />
        <small
          class="text-danger"
          *ngIf="registerForm.errors?.['passwordMismatch'] &&
    registerForm.get('confirmPassword')?.touched"
        >
          Passwords do not match
        </small>
      </div>

      <!-- Submit Button -->
      <div class="d-grid">
        <button
          type="submit"
          class="btn btn-primary"
          [disabled]="loading || registerForm.invalid"
        >
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Register
        </button>
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3 text-center">
        {{ errorMessage }}
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="alert alert-success mt-3 text-center">
        {{ successMessage }}
      </div>

    </form>

    <!-- Login Link -->
    <div class="text-center mt-3">
      <p class="mb-0">
        Already have an account?
        <a routerLink="/" class="text-primary fw-bold">Login here</a>
      </p>
    </div>
  </div>
</div>
